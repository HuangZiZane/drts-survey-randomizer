
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>幸福小黃搭乘偏好調查</title>
</head>

<body>
  <p>正在為您分配問卷版本，請稍候...</p>

  <script>
    // 請替換成你自己的10個SurveyCake網址
    const surveys = {
      A: "https://www.surveycake.com/s/9KL1P",
      B: "https://www.surveycake.com/s/VBLL6",
      C: "https://www.surveycake.com/s/6w81X",
      D: "https://www.surveycake.com/s/oXP63",
      E: "https://www.surveycake.com/s/70X4q",
      F: "https://www.surveycake.com/s/Abk1A",
      G: "https://www.surveycake.com/s/XeX19",
      H: "https://www.surveycake.com/s/ZvoRM",
      I: "https://www.surveycake.com/s/d94W2",
      J: "https://www.surveycake.com/s/B4n7l"
    };

    // 同一瀏覽器再次開啟時，維持相同版本
    const storageKey = "drts_survey_version";
    const versions = Object.keys(surveys);

    let version = localStorage.getItem(storageKey);

    if (!versions.includes(version)) {
      const randomIndex =
        Math.floor(Math.random() * versions.length);

      version = versions[randomIndex];
      localStorage.setItem(storageKey, version);
    }

    // 自動跳轉到對應問卷
    window.location.replace(surveys[version]);
  </script>
</body>
</html>
